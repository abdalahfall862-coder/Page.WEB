<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MethShop - Inscription</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
    <script src="js/sidebar.js"></script>
</head>
<body class="bg-[#FCFBFA] min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-[32px] shadow-xl w-full max-w-md mx-4">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-[#1A1A1A]"><i class="fa-solid fa-bag-shopping text-[#6B7A4F] mr-2"></i>MethShop</h1>
            <p class="text-sm text-[#686663] mt-2">Créez un compte</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="text-xs font-semibold text-[#1A1A1A]">Nom complet</label>
                <input type="text" id="name" class="w-full border border-[#E3E1DC] rounded-full px-4 py-3 mt-1 focus:outline-[#6B7A4F] text-sm" placeholder="Votre nom">
            </div>
            <div>
                <label class="text-xs font-semibold text-[#1A1A1A]">Email</label>
                <input type="email" id="email" class="w-full border border-[#E3E1DC] rounded-full px-4 py-3 mt-1 focus:outline-[#6B7A4F] text-sm" placeholder="votre@email.com">
            </div>
            <div>
                <label class="text-xs font-semibold text-[#1A1A1A]">Mot de passe</label>
                <input type="password" id="password" class="w-full border border-[#E3E1DC] rounded-full px-4 py-3 mt-1 focus:outline-[#6B7A4F] text-sm" placeholder="••••••••">
            </div>
            <button onclick="register()" class="w-full bg-[#6B7A4F] hover:bg-[#576440] text-white py-3 rounded-full font-medium transition shadow-md">
                S'inscrire
            </button>
        </div>
        <p class="text-center text-sm text-[#686663] mt-6">
            Déjà un compte ? <a href="login.html" class="text-[#6B7A4F] font-semibold">Se connecter</a>
        </p>

        <div id="message" class="mt-4 text-center text-sm"></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
