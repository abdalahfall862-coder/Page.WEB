<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MethShop - Produits</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#FCFBFA] text-[#2C2B2A]">

    <nav class="bg-white border-b border-[#EAE8E3] sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold text-[#1A1A1A]"><i class="fa-solid fa-bag-shopping text-[#6B7A4F] mr-2"></i>MethShop</a>
            <div class="flex items-center gap-4">
                <a href="index.html" class="text-sm font-medium hover:text-[#6B7A4F]">Accueil</a>
                <a href="products.html" class="text-sm font-medium text-[#6B7A4F]">Produits</a>
                <a href="cart.html" class="text-sm font-medium hover:text-[#6B7A4F] relative">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-[#6B7A4F] text-white text-xs w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
                </a>
                <div id="auth-buttons">
                    <a href="login.html" class="bg-[#6B7A4F] text-white px-4 py-2 rounded-full text-sm font-medium">Connexion</a>
                </div>
                <div id="user-menu" class="hidden items-center gap-2">
                    <span id="user-name" class="text-sm font-medium"></span>
                    <button onclick="logout()" class="text-red-500 text-sm"><i class="fa-solid fa-sign-out"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <section class="max-w-7xl mx-auto px-6 py-6">
    <div class="flex flex-wrap gap-4 items-center">
        <select id="category-filter" onchange="filterProducts()" class="border border-[#E3E1DC] rounded-full px-4 py-2 text-sm bg-white focus:outline-[#6B7A4F]">
            <option value="">Toutes les catégories</option>
        </select>
        <input type="number" id="min-price" placeholder="Prix min"
            class="border border-[#E3E1DC] rounded-full px-4 py-2 text-sm w-32 focus:outline-[#6B7A4F]">
        <input type="number" id="max-price" placeholder="Prix max"
            class="border border-[#E3E1DC] rounded-full px-4 py-2 text-sm w-32 focus:outline-[#6B7A4F]">
        <input type="text" id="search" placeholder="Rechercher..."
            oninput="filterProducts()"
            class="border border-[#E3E1DC] rounded-full px-4 py-2 text-sm flex-1 max-w-xs focus:outline-[#6B7A4F]">
        <button onclick="filterProducts()" class="bg-[#6B7A4F] text-white px-6 py-2 rounded-full text-sm font-medium hover:bg-[#576440]">
            <i class="fa-solid fa-search mr-1"></i> Filtrer
        </button>
    </div>
</section>

    <section class="max-w-7xl mx-auto px-6 py-6">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6" id="products-container">
            <div class="text-center py-12 col-span-full">
                <i class="fa-solid fa-spinner fa-spin text-3xl text-[#6B7A4F]"></i>
                <p class="text-sm text-gray-400 mt-2">Chargement...</p>
            </div>
        </div>
        <div class="flex justify-center mt-8 gap-2" id="pagination"></div>
    </section>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
