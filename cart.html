<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MethShop - Panier</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
    <script src="js/sidebar.js"></script>
</head>
<body class="bg-[#FCFBFA] text-[#2C2B2A]">

    <nav class="bg-white border-b border-[#EAE8E3] sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold text-[#1A1A1A]"><i class="fa-solid fa-bag-shopping text-[#6B7A4F] mr-2"></i>MethShop</a>
            <div class="flex items-center gap-4">
                <a href="index.html" class="text-sm font-medium hover:text-[#6B7A4F]">Accueil</a>
                <a href="products.html" class="text-sm font-medium hover:text-[#6B7A4F]">Produits</a>
                <a href="cart.html" class="text-sm font-medium text-[#6B7A4F]">Panier</a>
                <div id="user-menu" class="hidden items-center gap-2">
                    <span id="user-name" class="text-sm font-medium"></span>
                    <button onclick="logout()" class="text-red-500 text-sm"><i class="fa-solid fa-sign-out"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <section class="max-w-4xl mx-auto px-6 py-12">
        <h2 class="text-2xl font-bold text-[#1A1A1A] mb-6">Mon Panier</h2>
        
        <div id="cart-items" class="space-y-4">
            <div class="text-center py-12 text-gray-400">
                <i class="fa-solid fa-cart-arrow-down text-4xl mb-2"></i>
                <p>Votre panier est vide</p>
                <a href="products.html" class="text-[#6B7A4F] font-medium mt-2 inline-block">Continuer les achats</a>
            </div>
        </div>

        <div id="cart-summary" class="hidden mt-8 bg-white rounded-[24px] p-6 shadow-sm space-y-5">
            <!-- Adresse de livraison -->
            <h3 class="font-bold text-base text-[#1A1A1A]">Adresse de livraison</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <input id="street" type="text" placeholder="Rue / Quartier" 
                    class="border border-[#E3E1DC] rounded-full px-4 py-2 text-sm focus:outline-[#6B7A4F] col-span-full">
                <input id="city" type="text" placeholder="Ville (ex: Dakar)" 
                    class="border border-[#E3E1DC] rounded-full px-4 py-2 text-sm focus:outline-[#6B7A4F]">
                <input id="zipcode" type="text" placeholder="Code postal (optionnel)" 
                    class="border border-[#E3E1DC] rounded-full px-4 py-2 text-sm focus:outline-[#6B7A4F]">
            </div>
            <!-- Résumé prix -->
            <div class="border-t border-[#EAE8E3] pt-4 space-y-2 text-sm">
                <div class="flex justify-between text-[#686663]">
                    <span>Sous-total</span>
                    <span id="cart-subtotal">0 FCFA</span>
                </div>
                <div class="flex justify-between text-[#686663]">
                    <span>Livraison estimée</span>
                    <span id="cart-delivery">1 500 FCFA</span>
                </div>
                <div class="flex justify-between items-center font-bold text-base text-[#1A1A1A] pt-2 border-t border-[#EAE8E3]">
                    <span>Total</span>
                    <span id="cart-total" class="text-[#6B7A4F] text-xl">0 FCFA</span>
                </div>
            </div>
            <button onclick="checkout()" class="w-full bg-[#6B7A4F] hover:bg-[#576440] text-white py-3 rounded-full font-medium transition shadow-md">
                Passer la commande <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </div>
    </section>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
