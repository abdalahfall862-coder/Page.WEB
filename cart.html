<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MethShop - Panier</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#FCFBFA] text-[#2C2B2A]">

    <nav class="bg-white border-b border-[#EAE8E3] sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold text-[#1A1A1A]"><i class="fa-solid fa-bag-shopping text-[#6B7A4F] mr-2"></i>MethShop</a>
            <div class="flex items-center gap-4">
                <a href="index.html" class="text-sm font-medium hover:text-[#6B7A4F]">Accueil</a>
                <a href="products.html" class="text-sm font-medium hover:text-[#6B7A4F]">Produits</a>
                <a href="cart.html" class="text-sm font-medium text-[#6B7A4F]">Panier</a>
                <div id="user-menu" class="hidden items-center gap-2">
                    <span id="user-name" class="text-sm font-medium"></span>
                    <button onclick="logout()" class="text-red-500 text-sm"><i class="fa-solid fa-sign-out"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <section class="max-w-4xl mx-auto px-6 py-12">
        <h2 class="text-2xl font-bold text-[#1A1A1A] mb-6">Mon Panier</h2>
        
        <div id="cart-items" class="space-y-4">
            <div class="text-center py-12 text-gray-400">
                <i class="fa-solid fa-cart-arrow-down text-4xl mb-2"></i>
                <p>Votre panier est vide</p>
                <a href="products.html" class="text-[#6B7A4F] font-medium mt-2 inline-block">Continuer les achats</a>
            </div>
        </div>

        <div id="cart-summary" class="hidden mt-8 bg-white rounded-[24px] p-6 shadow-sm">
            <div class="flex justify-between items-center mb-4">
                <span class="text-lg font-medium">Total</span>
                <span id="cart-total" class="text-2xl font-bold text-[#6B7A4F]">0 FCFA</span>
            </div>
            <button onclick="checkout()" class="w-full bg-[#6B7A4F] hover:bg-[#576440] text-white py-3 rounded-full font-medium transition shadow-md">
                Passer la commande <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </div>
    </section>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
